<!DOCTYPE html>
<html>
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@800&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      width: 780px;
      height: 220px;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #FAF7F0; /* Warm ivory background */
      font-family: 'Outfit', sans-serif;
      overflow: hidden;
    }

    .container {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px;
    }

    .logo-text {
      font-size: 4.6rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.1;
      margin-bottom: 0.75rem;
      background: linear-gradient(to right, #0D1824 0%, #0D1824 68%, #C8860A 68%, #EAB308 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .logo-tagline {
      font-size: 1.25rem;
      font-weight: 700;
      color: #1B4D8E;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-text">Construction Buddy</div>
    <div class="logo-tagline">Home & Commercial Contractors</div>
  </div>
</body>
</html>
